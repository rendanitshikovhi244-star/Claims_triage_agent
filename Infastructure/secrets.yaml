---
AWSTemplateFormatVersion: "2010-09-09"

Description: >
  AWS Secrets Manager secret for the Claims Triage Agent.
  Stores API keys, model configuration, and infrastructure connection strings.

Parameters:

  Environment:
    Description: Environment prefix (dev, staging, prod)
    Type: String
    AllowedValues:
      - dev
      - staging
      - prod

  SecretName:
    Description: Name of the Secrets Manager secret
    Type: String
    Default: claims-triage-agent-secret

  HuggingFaceApiKey:
    Description: HuggingFace API key
    Type: String
    NoEcho: true

  HfModelFast:
    Description: "Model ID for FAST tier (e.g. huggingface/Qwen/Qwen2.5-14B-Instruct)"
    Type: String
    Default: huggingface/Qwen/Qwen2.5-14B-Instruct

  HfModelMid:
    Description: "Model ID for MID tier (e.g. huggingface/meta-llama/Llama-3.3-70B-Instruct)"
    Type: String
    Default: huggingface/meta-llama/Llama-3.3-70B-Instruct

  HfModelMain:
    Description: "Model ID for MAIN tier (e.g. huggingface/MiniMaxAI/MiniMax-M2.7)"
    Type: String
    Default: huggingface/MiniMaxAI/MiniMax-M2.7

  RedisUrl:
    Description: Redis connection URL
    Type: String
    Default: redis://localhost:6379/0

  DatabaseUrl:
    Description: PostgreSQL connection URL
    Type: String
    NoEcho: true


Resources:

  ClaimsTriageSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${SecretName}-${Environment}"
      Description: !Sub "Claims Triage Agent secrets (${Environment})"
      SecretString: !Sub |
        {
          "HUGGINGFACE_API_KEY": "${HuggingFaceApiKey}",
          "HF_MODEL_FAST": "${HfModelFast}",
          "HF_MODEL_MID": "${HfModelMid}",
          "HF_MODEL_MAIN": "${HfModelMain}",
          "REDIS_URL": "${RedisUrl}",
          "DATABASE_URL": "${DatabaseUrl}"
        }
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: ClaimsTriageAgent


Outputs:

  SecretArn:
    Description: ARN of the created secret
    Value: !Ref ClaimsTriageSecret
    Export:
      Name: !Sub "${AWS::StackName}-SecretArn"

  SecretName:
    Description: Name of the created secret
    Value: !Sub "${SecretName}-${Environment}"
